steps:
  # ─── Step 1: Build the Docker image ──────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-image
    args:
      - build
      - "--tag=$_GCR_HOSTNAME/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - "--tag=$_GCR_HOSTNAME/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME:latest"
      - "./alzan-be"

  # ─── Step 2: Push the image to Artifact Registry ─────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-image
    args:
      - push
      - "--all-tags"
      - "$_GCR_HOSTNAME/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME"

  # ─── Step 3: Deploy to Cloud Run ─────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - $_SERVICE_NAME
      - "--platform=managed"
      - "--image=$_GCR_HOSTNAME/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME:$COMMIT_SHA"
      - >-
        --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID,gcb-trigger-id=$_TRIGGER_ID
      - "--region=$_DEPLOY_REGION"

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _GCR_HOSTNAME: europe-west1-docker.pkg.dev
  _PLATFORM: managed
  _SERVICE_NAME: alzan-backend
  _ARTIFACT_REPO: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west1

tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - alzan-health
