name: Code Quality

on:
  push:
    paths:
      - "alzan-be/**"
      - "alzan-fe/**"
  pull_request:
    paths:
      - "alzan-be/**"
      - "alzan-fe/**"

jobs:
  be-quality:
    name: BE — Format & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./alzan-be

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js + Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "alzan-be/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check linting
        run: pnpm run lint:check

  fe-quality:
    name: FE — Format, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./alzan-fe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js + Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "alzan-fe/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Generate OpenAPI
        run: pnpm run openapi:generate

      - name: Lint
        run: pnpm run lint:check

      - name: Build app
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build
